server {
  # haproxy terminates TLS and forwards with proxy_protocol on 81/82
  listen 127.0.0.1:81 proxy_protocol;
  listen 127.0.0.1:82 proxy_protocol;
  server_name kelaas.example.ir;

  server_tokens off;
  absolute_redirect off;
  client_max_body_size 12m;

  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Everything is served from this host: no font, script or style comes from
  # the public internet, so the LMS behaves the same on the national network.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # API goes straight to Django: fewer hops, no rewrite surprises.
  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # haproxy passes the real client address through the PROXY protocol.
    proxy_set_header X-Real-IP $proxy_protocol_addr;
    proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }

  # Avatars and other uploaded media live on the host volume.
  location /media/ {
    alias /srv/lms/media/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $proxy_protocol_addr;
    proxy_set_header X-Forwarded-For $proxy_protocol_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
